name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_openai_smoke:
        description: Run one protected real-OpenAI smoke request
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-suite:
    name: Local mock-backed suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      AI_PROVIDER: mock
      ENABLE_REAL_AI: "false"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use the pinned npm release
        run: npm install --global npm@10.9.8

      - name: Bootstrap exact dependencies and local services
        shell: bash
        run: |
          set -o pipefail
          bootstrap_log="${RUNNER_TEMP}/lets-go-green-bootstrap.log"

          if npm run bootstrap 2>&1 | tee "$bootstrap_log"; then
            exit 0
          fi

          diagnostic="$(
            tail -n 60 "$bootstrap_log" \
              | sed -E \
                  -e 's#postgres(ql)?://[^[:space:]]+#<redacted-local-database-url>#gI' \
                  -e 's#eyJ[A-Za-z0-9._-]+#<redacted-local-token>#g' \
                  -e 's#sb_(publishable|secret)_[A-Za-z0-9._-]+#<redacted-local-token>#g' \
                  -e 's#([A-Z_]*(KEY|TOKEN|PASSWORD)[A-Z_]*[=:][[:space:]]*)[^[:space:]]+#\1<redacted>#gI' \
              | tr '\r\n' '  '
          )"
          diagnostic="${diagnostic:0:3500}"
          diagnostic="${diagnostic//'%'/'%25'}"

          printf '::error title=Sanitized bootstrap diagnostic::%s\n' \
            "$diagnostic"
          exit 1

      - name: Audit dependency security
        run: npm run audit:security

      - name: Check generated database type drift
        run: npm run db:types:check

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit and component tests
        run: npm run test

      - name: Run database and RLS tests
        run: npm run test:db

      - name: Build the production application
        run: npm run build

      - name: Run Playwright end-to-end and accessibility tests
        run: npm run test:e2e

      - name: Upload useful browser diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local services
        if: always()
        run: npm run down

  real-openai-smoke:
    name: Protected real OpenAI smoke test
    if: github.event_name == 'workflow_dispatch' && inputs.run_openai_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: openai-smoke
    env:
      AI_PROVIDER: openai
      ENABLE_REAL_AI: "true"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact dependencies
        run: |
          npm install --global npm@10.9.8
          npm ci

      - name: Run one budget-bounded real-provider request
        run: npm run openai:smoke
